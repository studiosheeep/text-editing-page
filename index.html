<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>漫画原稿エディタ</title>
<style>
/* =====================================================
   基本
===================================================== */
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f5f5f7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    color: #222;
}
/* =====================================================
   アプリ全体
===================================================== */
.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
/* =====================================================
   ヘッダー
===================================================== */
.header {
    padding: 12px 14px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
}
.header-title {
    font-size: 18px;
    font-weight: bold;
}
/* =====================================================
   アイコンツールバー
===================================================== */
.toolbar {
    display: flex;
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
/*
   アイコン1個
*/
.tool-button {
    flex: 1 0 20%;
    min-width: 65px;
    height: 64px;
    border: none;
    background: #ffffff;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    border-right: 1px solid #eee;
    font-size: 12px;
}
/*
   アイコン
*/
.tool-icon {
    font-size: 25px;
    line-height: 1;
}
/*
   選択中
*/
.tool-button.active {
    background: #eeeeF3;
}
/* =====================================================
   入力パネル
===================================================== */
.panel-container {
    background: #ffffff;
    border-bottom: 1px solid #ddd;
}
/*
   パネル本体
*/
.input-panel {
    display: none;
    padding: 14px;
}
/*
   表示中のパネル
*/
.input-panel.active {
    display: block;
}
/*
   パネルタイトル
*/
.panel-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
}
/*
   空タイトルは非表示
*/
.panel-title:empty {
    display: none;
}
/*
   入力行
*/
.input-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 9px;
}
/*
   最終行の余白を除去
*/
.input-row:last-child {
    margin-bottom: 0;
}
/*
   ラベル
*/
.input-label {
    min-width: 48px;
    font-size: 14px;
}
/*
   入力
*/
input {
    flex: 1;
    min-width: 0;
    height: 42px;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
    background: #fff;
}
input:focus {
    outline: none;
    border-color: #888;
}
/*
   記入ボタン
*/
.insert-button {
    height: 42px;
    padding: 0 15px;
    border: none;
    border-radius: 7px;
    background: #333;
    color: white;
    font-size: 14px;
    white-space: nowrap;
}
/*
   パネルを閉じる
*/
.close-panel {
    width: 100%;
    height: 36px;
    margin-top: 3px;
    border: none;
    background: #f1f1f1;
    border-radius: 6px;
    color: #555;
}
/* =====================================================
   エディタ
===================================================== */
.editor-area {
    flex: 1;
    min-height: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
}
/*
   エディタ本体
*/
.editor-wrapper {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: white;
    overflow: hidden;
}
/*
   ハイライト層
*/
.highlight-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 14px;
    font-size: 16px;
    line-height: 1.7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow: hidden;
    pointer-events: none;
    color: #222;
}
/*
   実際の入力欄
*/
#editor {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 14px;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-size: 16px;
    line-height: 1.7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic", sans-serif;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow: auto;
    color: transparent;
    caret-color: #222;
    z-index: 2;
}
/* =====================================================
   ハイライト
===================================================== */
.highlight {
    border-radius: 3px;
    padding: 1px 2px;
}
/*
   ページ
   p001〜p999
*/
.highlight-page {
    background: #ddd8f2;
}
/*
   #上中下
   #右左
*/
.highlight-panel {
    background: #bfe8f0;
}
/*
   @数字
*/
.highlight-placement {
    background: #f4c477;
}
/*
   ＊モデル名
*/
.highlight-model {
    background: #c9eb9a;
}
/*
   :プリセット名
*/
.highlight-preset {
    background: #f2b8d1;
}
/* =====================================================
   下部ボタン
===================================================== */
.editor-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}
.editor-buttons button {
    flex: 1;
    height: 44px;
    border: none;
    border-radius: 7px;
    background: #333;
    color: white;
    font-size: 14px;
}
/* =====================================================
   スマートフォン調整
===================================================== */
@media (max-width: 600px) {
    .header {
        padding: 10px 12px;
    }
    .header-title {
        font-size: 17px;
    }
    .tool-button {
        min-width: 64px;
        height: 60px;
    }
    .tool-icon {
        font-size: 23px;
    }
    .editor-area {
        padding: 8px;
    }
}
</style>
</head>
<body>
<div class="app">
<!-- =================================================
     タイトル
================================================= -->
<!--<div class="header">
    <div class="header-title">
    </div>
</div>-->
<!-- =================================================
     アイコン
================================================= -->
<div class="toolbar">
    <button
        class="tool-button"
        data-panel="page-panel"
        onclick="togglePanel('page-panel', this)"
    >
        <span class="tool-icon">📄</span>
        <span>ページ</span>
    </button>
    <button
        class="tool-button"
        data-panel="vertical-panel"
        onclick="togglePanel('vertical-panel', this)"
    >
        <span class="tool-icon">▤</span>
        <span>上中下</span>
    </button>
    <button
        class="tool-button"
        data-panel="horizontal-panel"
        onclick="togglePanel('horizontal-panel', this)"
    >
        <span class="tool-icon">▥</span>
        <span>右左</span>
    </button>
    <button
        class="tool-button"
        data-panel="live2d-panel"
        onclick="togglePanel('live2d-panel', this)"
    >
        <span class="tool-icon">👤</span>
        <span>Live2D</span>
    </button>
    <button
        class="tool-button"
        data-panel="placement-panel"
        onclick="togglePanel('placement-panel', this)"
    >
        <span class="tool-icon">@</span>
        <span>配置先</span>
    </button>
</div>
<!-- =================================================
     入力パネル
================================================= -->
<div class="panel-container">
<!-- ================= ページ ================= -->
<div
    id="page-panel"
    class="input-panel"
>
    <!--
    <div class="panel-title">
    </div>
    -->
    <div class="input-row">
        <span class="input-label">
            ページ
        </span>
        <input
            id="page"
            type="number"
            min="1"
            max="999"
            placeholder="001〜999"
        >
        <span>
            ページ
        </span>
        <button
            class="insert-button"
            onclick="insertPage()"
        >
            記入
        </button>
    </div>
    <!--
    <button
        class="close-panel"
        onclick="closePanels()"
    >
        閉じる
    </button>
    -->
</div>
<!-- ================= 上中下 ================= -->
<div
    id="vertical-panel"
    class="input-panel"
>
    <!--
    <div class="panel-title">
    </div>
    -->
    <div class="input-row">
        <span class="input-label">
            上段
        </span>
        <input
            id="top"
            type="text"
            inputmode="numeric"
            placeholder="数字"
        >
        <span>コマ</span>
        <button
            class="insert-button"
            onclick="insertVerticalPanels()"
        >
            記入
        </button>
    </div>
    <div class="input-row">
        <span class="input-label">
            中段
        </span>
        <input
            id="middle"
            type="text"
            inputmode="numeric"
            placeholder="数字"
        >
        <span>コマ</span>
    </div>
    <div class="input-row">
        <span class="input-label">
            下段
        </span>
        <input
            id="bottom"
            type="text"
            inputmode="numeric"
            placeholder="数字"
        >
        <span>コマ</span>
    </div>
    <!--
    <button
        class="close-panel"
        onclick="closePanels()"
    >
        閉じる
    </button>
    -->
</div>
<!-- ================= 右左 ================= -->
<div
    id="horizontal-panel"
    class="input-panel"
>
    <!--
    <div class="panel-title">
    </div>
    -->
    <div class="input-row">
        <span class="input-label">
            右段
        </span>
        <input
            id="right"
            type="text"
            inputmode="numeric"
            placeholder="数字"
        >
        <span>コマ</span>
        <button
            class="insert-button"
            onclick="insertHorizontalPanels()"
        >
            記入
        </button>
    </div>
    <div class="input-row">
        <span class="input-label">
            左段
        </span>
        <input
            id="left"
            type="text"
            inputmode="numeric"
            placeholder="数字"
        >
        <span>コマ</span>
    </div>
    <!--
    <button
        class="close-panel"
        onclick="closePanels()"
    >
        閉じる
    </button>
    -->
</div>
<!-- ================= Live2D ================= -->
<div
    id="live2d-panel"
    class="input-panel"
>
    <!--
    <div class="panel-title">
    </div>
    -->
    <div class="input-row">
        <span class="input-label">
            モデル名
        </span>
        <input
            id="model"
            type="text"
            placeholder="モデル名"
        >
        <button
            class="insert-button"
            onclick="insertLive2D()"
        >
            記入
        </button>
    </div>
    <div class="input-row">
        <span class="input-label">
            プリセット
        </span>
        <input
            id="preset"
            type="text"
            placeholder="プリセット名"
        >
    </div>
    <!--
    <button
        class="close-panel"
        onclick="closePanels()"
    >
        閉じる
    </button>
    -->
</div>
<!-- ================= 配置先 ================= -->
<div
    id="placement-panel"
    class="input-panel"
>
    <!--
    <div class="panel-title">
    </div>
    -->
    <div class="input-row">
        <input
            id="placement"
            type="text"
            inputmode="numeric"
            placeholder="コマ番号"
        >
        <span>コマ目</span>
        <button
            class="insert-button"
            onclick="insertPlacement()"
        >
            記入
        </button>
    </div>
    <!--
    <button
        class="close-panel"
        onclick="closePanels()"
    >
        閉じる
    </button>
    -->
</div>
</div>
<!-- =================================================
     エディタ
================================================= -->
<div class="editor-area">
    <div class="editor-wrapper">
        <!-- ハイライト -->
        <div
            id="highlight"
            class="highlight-layer"
        ></div>
        <!-- 入力欄 -->
        <textarea
            id="editor"
            spellcheck="false"
            placeholder="ここに文章を入力してください。上のアイコンから記法を挿入できます。"
        ></textarea>
    </div>
    <div class="editor-buttons">
        <button onclick="copyText()">
            コピー
        </button>
        <button onclick="saveTxt()">
            TXT保存
        </button>
    </div>
</div>
</div>
<script>
/* =====================================================
   エディタ
===================================================== */
const editor =
    document.getElementById("editor");
const highlight =
    document.getElementById("highlight");
/* =====================================================
   パネル切り替え
===================================================== */
function togglePanel(panelId, button) {
    const panel =
        document.getElementById(panelId);
    const isActive =
        panel.classList.contains("active");
    /*
       全パネルを閉じる
    */
    closePanels();
    /*
       すでに開いていた場合は
       そのまま閉じる
    */
    if (isActive) {
        return;
    }
    /*
       パネルを開く
    */
    panel.classList.add("active");
    button.classList.add("active");
}
/*
   全パネルを閉じる
*/
function closePanels() {
    document
        .querySelectorAll(".input-panel")
        .forEach(panel => {
            panel.classList.remove("active");
        });
    document
        .querySelectorAll(".tool-button")
        .forEach(button => {
            button.classList.remove("active");
        });
}
/* =====================================================
   カーソル位置へ挿入
===================================================== */
function insertAtCursor(text) {
    const start =
        editor.selectionStart;
    const end =
        editor.selectionEnd;
    const current =
        editor.value;
    editor.value =
        current.substring(0, start)
        + text
        + current.substring(end);
    const newPosition =
        start + text.length;
    editor.focus();
    editor.setSelectionRange(
        newPosition,
        newPosition
    );
    updateHighlight();
}
/* =====================================================
   ページ
===================================================== */
function insertPage() {
    const value =
        document.getElementById("page").value;
    if (!value) {
        return;
    }
    const number =
        Number(value);
    if (
        !Number.isInteger(number) ||
        number < 1 ||
        number > 999
    ) {
        alert(
            "001〜999の数字を入力してください。"
        );
        return;
    }
    const page =
        String(number).padStart(3, "0");
    insertAtCursor(
        `p${page}\n`
    );
}
/* =====================================================
   上・中・下
===================================================== */
function insertVerticalPanels() {
    const top =
        document.getElementById("top").value;
    const middle =
        document.getElementById("middle").value;
    const bottom =
        document.getElementById("bottom").value;
    if (
        !top &&
        !middle &&
        !bottom
    ) {
        return;
    }
    insertAtCursor(
        `#上${top}中${middle}下${bottom}\n`
    );
}
/* =====================================================
   右・左
===================================================== */
function insertHorizontalPanels() {
    const right =
        document.getElementById("right").value;
    const left =
        document.getElementById("left").value;
    if (
        !right &&
        !left
    ) {
        return;
    }
    insertAtCursor(
        `#右${right}左${left}\n`
    );
}
/* =====================================================
   Live2D
===================================================== */
function insertLive2D() {
    const model =
        document.getElementById("model").value;
    const preset =
        document.getElementById("preset").value;
    if (
        !model &&
        !preset
    ) {
        return;
    }
    insertAtCursor(
        `＊${model}:${preset}`
    );
}
/* =====================================================
   配置先
===================================================== */
function insertPlacement() {
    const placement =
        document.getElementById("placement").value;
    if (!placement) {
        return;
    }
    /*
       改行なし
    */
    insertAtCursor(
        `@${placement}`
    );
}
/* =====================================================
   HTMLエスケープ
===================================================== */
function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
/* =====================================================
   ハイライト
===================================================== */
function highlightText(text) {
    let result =
        escapeHTML(text);
    const tokens = [];
    function token(html) {
        const id =
            `___TOKEN_${tokens.length}___`;
        tokens.push(html);
        return id;
    }
    /*
       ページ
    */
    result =
        result.replace(
            /p\d{3}\b/g,
            match => token(
                `<span class="highlight highlight-page">${match}</span>`
            )
        );
    /*
       上・中・下
    */
    result =
        result.replace(
            /#上[^\n]*?中[^\n]*?下[^\n]*/g,
            match => token(
                `<span class="highlight highlight-panel">${match}</span>`
            )
        );
    /*
       右・左
    */
    result =
        result.replace(
            /#右[^\n]*?左[^\n]*/g,
            match => token(
                `<span class="highlight highlight-panel">${match}</span>`
            )
        );
    /*
       モデル名
    */
    result =
        result.replace(
            /＊[^:\n@]*/g,
            match => token(
                `<span class="highlight highlight-model">${match}</span>`
            )
        );
    /*
       プリセット
    */
    result =
        result.replace(
            /:[^@\n]*/g,
            match => token(
                `<span class="highlight highlight-preset">${match}</span>`
            )
        );
    /*
       配置先
    */
    result =
        result.replace(
            /@\d+/g,
            match => token(
                `<span class="highlight highlight-placement">${match}</span>`
            )
        );
    /*
       トークンを復元
    */
    tokens.forEach(
        (html, index) => {
            result =
                result.replace(
                    `___TOKEN_${index}___`,
                    html
                );
        }
    );
    /*
       textareaと高さを合わせるための
       最後の改行
    */
    if (text.endsWith("\n")) {
        result += "\n";
    }
    return result;
}
/* =====================================================
   ハイライト更新
===================================================== */
function updateHighlight() {
    highlight.innerHTML =
        highlightText(editor.value);
    syncScroll();
}
/* =====================================================
   スクロール同期
===================================================== */
function syncScroll() {
    highlight.scrollTop =
        editor.scrollTop;
    highlight.scrollLeft =
        editor.scrollLeft;
}
/* =====================================================
   入力・スクロール
===================================================== */
editor.addEventListener(
    "input",
    updateHighlight
);
editor.addEventListener(
    "scroll",
    syncScroll
);
/* =====================================================
   コピー
===================================================== */
function copyText() {
    const text =
        editor.value;
    if (!text) {
        return;
    }
    navigator.clipboard
        .writeText(text)
        .then(() => {
            alert("コピーしました。");
        })
        .catch(() => {
            editor.focus();
            editor.select();
            document.execCommand("copy");
            alert("コピーしました。");
        });
}
/* =====================================================
   TXT保存
===================================================== */
function saveTxt() {
    const text =
        editor.value;
    if (!text) {
        alert(
            "保存する文章がありません。"
        );
        return;
    }
    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );
    const url =
        URL.createObjectURL(blob);
    const link =
        document.createElement("a");
    link.href = url;
    link.download =
        "漫画原稿.txt";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}
/* =====================================================
   初期化
===================================================== */
updateHighlight();
</script>
</body>
</html>
