<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創作お題ジェネレーター</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="お題">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* =====================================================
   基本
===================================================== */
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f5f5f7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    color: #222;
    -webkit-text-size-adjust: 100%;
}
/* =====================================================
   アプリ全体
===================================================== */
.app {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 14px 60px;
}
/* =====================================================
   ヘッダー
===================================================== */
.header {
    padding: 18px 2px 10px;
}
.header-title {
    font-size: 20px;
    font-weight: bold;
}
.header-sub {
    margin-top: 4px;
    font-size: 12px;
    color: #777;
}
/* =====================================================
   上部に貼り付く操作バー
===================================================== */
.composer {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245, 245, 247, 0.93);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    padding: 8px 0 10px;
    margin-bottom: 10px;
}
/*
   生成設定 (ジャンル / 形式)
*/
.settings {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
}
.segment {
    display: flex;
    background: #e6e6e8;
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
}
.segment button {
    border: none;
    background: transparent;
    color: #444;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}
.segment button.active {
    background: #ffffff;
    color: #111;
    font-weight: bold;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
/*
   タイマー
*/
.timer-bar {
    width: 100%;
    height: 4px;
    background: #e3e3e6;
    border-radius: 999px;
    overflow: hidden;
}
.timer-fill {
    height: 100%;
    width: 0%;
    background: #4a7ad6;
    border-radius: 999px;
}
.timer.paused .timer-fill {
    background: #bbb;
}
.timer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}
.timer-label {
    flex: 1;
    font-size: 12px;
    color: #888;
}
/*
   操作ボタン
*/
.bar-button {
    border: 1px solid #ddd;
    background: #ffffff;
    border-radius: 999px;
    font-size: 13px;
    font-family: inherit;
    color: #333;
    cursor: pointer;
    padding: 8px 14px;
    white-space: nowrap;
}
.bar-button:active {
    background: #eeeeF3;
}
.bar-button.primary {
    background: #4a7ad6;
    border-color: #4a7ad6;
    color: #ffffff;
    font-weight: bold;
}
/* =====================================================
   フィードの見出し
===================================================== */
.feed-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}
.feed-count {
    flex: 1;
    font-size: 12px;
    color: #888;
    white-space: nowrap;
}
.feed-head-buttons {
    display: flex;
    gap: 2px;
    margin-left: auto;
}
.text-button {
    border: none;
    background: none;
    color: #4a7ad6;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    padding: 4px;
}
/* =====================================================
   タイムライン
===================================================== */
.feed {
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 14px;
    overflow: hidden;
}
/*
   カード1枚
*/
.post {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid #eeeef0;
}
.post:last-child {
    border-bottom: none;
}
.post.latest {
    background: #fafbff;
}
/*
   出てきた瞬間のアニメーション
*/
.post.enter {
    animation: postin 0.45s ease;
}
@keyframes postin {
    from {
        opacity: 0;
        transform: translateY(-8px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}
/*
   アイコン
*/
.avatar {
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #eef3ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    line-height: 1;
}
.avatar.fantasy {
    background: #f5eefb;
}
/*
   本文まわり
*/
.post-main {
    flex: 1;
    min-width: 0;
}
.post-head {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    font-size: 13px;
}
.post-name {
    font-weight: bold;
}
.post-handle,
.post-time {
    color: #8a8a8f;
    font-size: 12px;
}
.post-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid #ddd;
    background: #fafafa;
    color: #555;
}
.post-badge.genre-real {
    background: #eef3ff;
    border-color: #ccd9f5;
    color: #3a5a9b;
}
.post-badge.genre-fantasy {
    background: #f5eefb;
    border-color: #e0cdf0;
    color: #75439b;
}
.post-body {
    margin-top: 5px;
    font-size: 15px;
    line-height: 1.85;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
/*
   縛り・読後感
*/
.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}
.chip {
    font-size: 12px;
    color: #555;
    background: #f2f2f4;
    border-radius: 7px;
    padding: 4px 9px;
}
.chip b {
    color: #999;
    font-weight: normal;
    margin-right: 4px;
}
/*
   カード下部の操作
*/
.post-actions {
    display: flex;
    gap: 20px;
    margin-top: 10px;
}
.post-action {
    border: none;
    background: none;
    padding: 2px 0;
    font-size: 12px;
    font-family: inherit;
    color: #8a8a8f;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
}
.post-action:active {
    opacity: 0.6;
}
.post-action.liked {
    color: #d3455b;
}
/*
   さらに表示 / 空表示
*/
.feed-more {
    width: 100%;
    border: none;
    border-top: 1px solid #eeeef0;
    background: #ffffff;
    color: #4a7ad6;
    font-family: inherit;
    font-size: 13px;
    padding: 14px;
    cursor: pointer;
}
.feed-empty {
    padding: 22px 14px;
    font-size: 13px;
    color: #999;
    text-align: center;
}
/* =====================================================
   トースト
===================================================== */
.toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(10px);
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
}
.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
/* =====================================================
   注記
===================================================== */
.note {
    margin-top: 18px;
    font-size: 11px;
    color: #999;
    line-height: 1.7;
}
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-title">創作お題ジェネレーター</div>
        <div class="header-sub">30秒ごとにお題が流れてきます。新しいものが上に積まれます。</div>
    </div>

    <!-- 上部操作バー -->
    <div class="composer">
        <div class="settings">
            <div class="segment" id="genre-seg">
                <button data-genre="any" class="active">おまかせ</button>
                <button data-genre="real">現実</button>
                <button data-genre="fantasy">ファンタジー</button>
            </div>
            <div class="segment" id="type-seg">
                <button data-type="any" class="active">両方</button>
                <button data-type="theme">お題</button>
                <button data-type="story">あらすじ</button>
            </div>
        </div>
        <div class="timer" id="timer">
            <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
            <div class="timer-row">
                <div class="timer-label" id="timer-label">次のお題まで 30 秒</div>
                <button class="bar-button" id="btn-pause">⏸ 一時停止</button>
                <button class="bar-button primary" id="btn-next">🎲 いま出す</button>
            </div>
        </div>
    </div>

    <!-- フィード -->
    <div class="feed-head">
        <div class="feed-count" id="feed-count"></div>
        <div class="segment" id="filter-seg">
            <button data-filter="all" class="active">すべて</button>
            <button data-filter="liked">★のみ</button>
        </div>
        <div class="feed-head-buttons">
            <button class="text-button" id="btn-copy-all">まとめてコピー</button>
            <button class="text-button" id="btn-clear">全消去</button>
        </div>
    </div>
    <div class="feed" id="feed"></div>

    <div class="note">
        ・出てきたお題は自動でカード保存されます (このブラウザ内 localStorage、保存できる限り保持)<br>
        ・キーボード: スペースで一時停止 / → で次のお題
    </div>
</div>

<div class="toast" id="toast"></div>

            "月の欠片", "名前を食べる獣", "逆さの塔", "七日だけの春", "翼の修理屋",
            "忘れられた神さま", "空を泳ぐ鯨", "値札のついた奇跡", "影の市場",
            "眠らない灯台", "星の落とし物", "鍵のかかった季節", "竜の抜け殻",
            "地図にない駅", "売り物になった寿命", "終わらない冬の番人"
        ]
    }
};

/* 縛り (共通) */
var RULES = [
    "一人称で書く",
    "三人称で書く",
    "会話文だけで書く",
    "情景描写から書きはじめる",
    "最後の一行を先に決めて書く",
    "800文字以内でまとめる",
    "時系列を逆から描く",
    "登場人物は二人だけ",
    "「悲しい」「嬉しい」を使わない",
    "登場人物を一歩も動かさない",
    "一日のうちの出来事だけで書く",
    "雨の音をどこかに入れる",
    "台詞は三つまで",
    "説明をせずに状況だけで伝える",
    "最後に必ず食べ物を出す",
    "手紙か日記の形式で書く"
];

/* 読後感 (共通) */
var MOODS = [
    "せつなさ", "静かな希望", "後味の悪さ", "小さな笑い", "胸のざわつき",
    "ほろ苦い和解", "こわさのあとの安心", "やさしい別れ", "淡い恋の気配",
    "取り返しのつかなさ", "生活のにおい", "ふしぎな明るさ"
];

/* お題の文型 */
var THEME_TEMPLATES = [
    function (a, b) { return "「" + a + "」と「" + b + "」。\nこのふたつを結びつけて一本書く。"; },
    function (a, b) { return "「" + a + "」から始まり、「" + b + "」で終わる話。"; },
    function (a, b) { return "「" + a + "」をめぐって、ふたりの人物がすれ違う話。"; },
    function (a, b) { return "「" + a + "」というタイトルで書く。\n本文には「" + b + "」を必ず登場させること。"; },
    function (a, b) { return "「" + a + "」を、誰かに手放さなければならなくなる話。\n鍵になるのは「" + b + "」。"; },
    function (a, b) { return "「" + a + "」が、その日だけ特別な意味を持つ。\n締めくくりに「" + b + "」を置く。"; },
    function (a, b) { return "「" + a + "」を探している人物と、「" + b + "」を隠している人物の話。"; }
];

/* あらすじの文型 */
var STORY_TEMPLATES = [
    function (p) {
        return p.stage + "。\nその片隅にいる" + p.hero + "のもとに、ある日、" + p.event + "。\n"
            + p.twist + "。\nやがてその人は、" + p.goal + "。";
    },
    function (p) {
        return p.hero + "が、" + p.stage + "に流れ着く。\n" + p.event + "のは、その翌日のことだった。\n"
            + p.twist + "。\nそれでも" + p.goal + "——そこから物語が始まる。";
    },
    function (p) {
        return "舞台は" + p.stage + "。主人公は" + p.hero + "。\nある日、" + p.event + "。\n"
            + p.twist + "。\n" + p.goal + "——そんな一本。";
    },
    function (p) {
        return "ある日、" + p.event + "。\nそれが起きたのは" + p.stage + "、\n"
            + "受け取ったのは" + p.hero + "だった。\n" + p.twist + "。\nそして最後に、" + p.goal + "。";
    }
];

/* =====================================================
   ランダム補助
===================================================== */
function pick(list) {
    return list[Math.floor(Math.random() * list.length)];
}
/*
   同じ要素を引かずに2つ取り出す
*/
function pickTwo(list) {
    var a = pick(list);
    var b = pick(list);
    var guard = 0;
    while (b === a && list.length > 1 && guard < 20) {
        b = pick(list);
        guard++;
    }
    return [a, b];
}

/* =====================================================
   状態
===================================================== */
var INTERVAL_MS = 30000;
var PAGE_SIZE = 60;      /* 一度に表示するカード数 */
var MAX_ITEMS = 2000;    /* 保持するカードの上限 */

var state = {
    genre: "any",
    type: "any",
    filter: "all",
    paused: false,
    startedAt: 0,
    remain: INTERVAL_MS,
    shown: PAGE_SIZE
};

/* 新しい順に並んだカード配列 */
var feed = [];

/* =====================================================
   お題 / あらすじの生成
===================================================== */
function resolveGenre() {
    if (state.genre === "any") {
        return Math.random() < 0.5 ? "real" : "fantasy";
    }
    return state.genre;
}
function resolveType() {
    if (state.type === "any") {
        return Math.random() < 0.5 ? "theme" : "story";
    }
    return state.type;
}

function buildOne() {
    var genreKey = resolveGenre();
    var typeKey = resolveType();
    var d = DATA[genreKey];
    var text;

    if (typeKey === "theme") {
        var kw = pickTwo(d.keyword);
        text = pick(THEME_TEMPLATES)(kw[0], kw[1]);
    } else {
        text = pick(STORY_TEMPLATES)({
            stage: pick(d.stage),
            hero: pick(d.hero),
            event: pick(d.event),
            twist: pick(d.twist),
            goal: pick(d.goal)
        });
    }
    return {
        id: String(Date.now()) + "-" + Math.random().toString(36).slice(2, 8),
        genre: genreKey,
        type: typeKey,
        text: text,
        rule: pick(RULES),
        mood: pick(MOODS),
        at: Date.now(),
        liked: false
    };
}

/*
   直近のカードと重複しないように生成する
*/
function generate() {
    var recent = feed.slice(0, 12).map(function (item) {
        return item.text;
    });
    var item = buildOne();
    var guard = 0;
    while (recent.indexOf(item.text) !== -1 && guard < 30) {
        item = buildOne();
        guard++;
    }
    return item;
}

function genreLabel(item) {
    return DATA[item.genre] ? DATA[item.genre].label : "";
}
function typeLabel(item) {
    return item.type === "theme" ? "お題" : "あらすじ";
}
function toPlainText(item) {
    return "【" + genreLabel(item) + " / " + typeLabel(item) + "】\n"
        + item.text + "\n"
        + "縛り: " + item.rule + " / 読後感: " + item.mood;
}

/* =====================================================
   保存 (localStorage)
   ---------------------------------------------------
   容量いっぱいまで保持し、書き込めなくなったら
   古いカードから順に捨てて入るところまで残す。
===================================================== */
var STORE_KEY = "creative-prompt-feed";
var OLD_STORE_KEY = "creative-prompt-saved";

function loadFeed() {
    var raw = null;
    try {
        raw = localStorage.getItem(STORE_KEY);
    } catch (e) {
        raw = null;
    }
    if (raw) {
        try {
            var parsed = JSON.parse(raw);
            if (parsed instanceof Array) {
                feed = parsed.filter(function (item) {
                    return item && typeof item.text === "string";
                });
            }
        } catch (e) {
            feed = [];
        }
        return;
    }
    /* 旧バージョンで★保存したお題を引き継ぐ */
    try {
        var old = JSON.parse(localStorage.getItem(OLD_STORE_KEY) || "[]");
        if (old instanceof Array) {
            feed = old.map(function (item, index) {
                return {
                    id: "legacy-" + index,
                    genre: item.genre === "fantasy" ? "fantasy" : "real",
                    type: item.type === "story" ? "story" : "theme",
                    text: String(item.text || ""),
                    rule: String(item.rule || ""),
                    mood: String(item.mood || ""),
                    at: 0,
                    liked: true
                };
            }).filter(function (item) {
                return item.text;
            });
        }
    } catch (e) {
        feed = [];
    }
}

/*
   直前の persist() でカードを間引いたか
   (間引いた場合は画面を作り直す必要がある)
*/
var lastPersistTrimmed = false;

function persist() {
    lastPersistTrimmed = false;
    if (feed.length > MAX_ITEMS) {
        feed.length = MAX_ITEMS;
        lastPersistTrimmed = true;
    }
    for (var attempt = 0; attempt < 12; attempt++) {
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify(feed));
            if (lastPersistTrimmed) {
                toast("保存できる上限に達したため、古いカードを整理しました");
            }
            return true;
        } catch (e) {
            /* 容量オーバー: 古いカードを1割ずつ捨てて再挑戦 */
            if (feed.length <= 10) {
                toast("これ以上は保存できませんでした");
                lastPersistTrimmed = true;
                return false;
            }
            feed.splice(feed.length - Math.max(5, Math.floor(feed.length * 0.1)));
            lastPersistTrimmed = true;
        }
    }
    toast("これ以上は保存できませんでした");
    return false;
}

/* =====================================================
   表示
===================================================== */
var elFeed = document.getElementById("feed");
var elCount = document.getElementById("feed-count");

function visibleItems() {
    if (state.filter === "liked") {
        return feed.filter(function (item) {
            return item.liked;
        });
    }
    return feed;
}

/*
   経過時間の表示 (X のタイムラインに近い表記)
*/
function timeLabel(at) {
    if (!at) {
        return "以前";
    }
    var diff = Date.now() - at;
    if (diff < 60000) {
        return "たった今";
    }
    if (diff < 3600000) {
        return Math.floor(diff / 60000) + "分前";
    }
    if (diff < 86400000) {
        return Math.floor(diff / 3600000) + "時間前";
    }
    var d = new Date(at);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

function makeChip(label, value) {
    var chip = document.createElement("span");
    chip.className = "chip";
    var b = document.createElement("b");
    b.textContent = label;
    chip.appendChild(b);
    chip.appendChild(document.createTextNode(value));
    return chip;
}

/*
   カード1枚を組み立てる
*/
function makePost(item) {
    var post = document.createElement("div");
    post.className = "post";
    post.setAttribute("data-id", item.id);

    var avatar = document.createElement("div");
    avatar.className = "avatar" + (item.genre === "fantasy" ? " fantasy" : "");
    avatar.textContent = item.genre === "fantasy" ? "🐉" : "🌆";
    post.appendChild(avatar);

    var main = document.createElement("div");
    main.className = "post-main";

    /* 名前・時刻・バッジ */
    var head = document.createElement("div");
    head.className = "post-head";

    var name = document.createElement("span");
    name.className = "post-name";
    name.textContent = "お題ジェネレーター";
    head.appendChild(name);

    var handle = document.createElement("span");
    handle.className = "post-handle";
    handle.textContent = "@odai";
    head.appendChild(handle);

    var dot = document.createElement("span");
    dot.className = "post-handle";
    dot.textContent = "·";
    head.appendChild(dot);

    var time = document.createElement("span");
    time.className = "post-time";
    time.setAttribute("data-at", String(item.at || 0));
    time.textContent = timeLabel(item.at);
    head.appendChild(time);

    var gb = document.createElement("span");
    gb.className = "post-badge " + (item.genre === "fantasy" ? "genre-fantasy" : "genre-real");
    gb.textContent = genreLabel(item);
    head.appendChild(gb);

    var tb = document.createElement("span");
    tb.className = "post-badge";
    tb.textContent = typeLabel(item);
    head.appendChild(tb);

    main.appendChild(head);

    /* 本文 */
    var body = document.createElement("div");
    body.className = "post-body";
    body.textContent = item.text;
    main.appendChild(body);

    /* 縛り・読後感 */
    var chips = document.createElement("div");
    chips.className = "chips";
    if (item.rule) {
        chips.appendChild(makeChip("縛り", item.rule));
    }
    if (item.mood) {
        chips.appendChild(makeChip("読後感", item.mood));
    }
    main.appendChild(chips);

    /* 操作 */
    var actions = document.createElement("div");
    actions.className = "post-actions";

    var likeBtn = document.createElement("button");
    likeBtn.className = "post-action" + (item.liked ? " liked" : "");
    likeBtn.textContent = (item.liked ? "★" : "☆") + " お気に入り";
    likeBtn.addEventListener("click", function () {
        item.liked = !item.liked;
        persist();
        if (lastPersistTrimmed || (state.filter === "liked" && !item.liked)) {
            renderFeed();
        } else {
            likeBtn.className = "post-action" + (item.liked ? " liked" : "");
            likeBtn.textContent = (item.liked ? "★" : "☆") + " お気に入り";
            updateCount();
        }
    });
    actions.appendChild(likeBtn);

    var copyBtn = document.createElement("button");
    copyBtn.className = "post-action";
    copyBtn.textContent = "📋 コピー";
    copyBtn.addEventListener("click", function () {
        copyText(toPlainText(item));
    });
    actions.appendChild(copyBtn);

    var delBtn = document.createElement("button");
    delBtn.className = "post-action";
    delBtn.textContent = "🗑 削除";
    delBtn.addEventListener("click", function () {
        var index = feed.indexOf(item);
        if (index !== -1) {
            feed.splice(index, 1);
            persist();
            renderFeed();
        }
    });
    actions.appendChild(delBtn);

    main.appendChild(actions);
    post.appendChild(main);
    return post;
}

/*
   件数表示
*/
function updateCount() {
    var liked = feed.filter(function (item) {
        return item.liked;
    }).length;
    elCount.textContent = "カード " + feed.length + " 件"
        + (liked ? " (★ " + liked + ")" : "");
}

/*
   フィード全体を描き直す
*/
function renderFeed() {
    var items = visibleItems();
    if (state.shown < PAGE_SIZE) {
        state.shown = PAGE_SIZE;
    }
    elFeed.innerHTML = "";

    if (!items.length) {
        var empty = document.createElement("div");
        empty.className = "feed-empty";
        empty.textContent = state.filter === "liked"
            ? "★を付けたお題がここに並びます。"
            : "まもなく最初のお題が流れてきます。";
        elFeed.appendChild(empty);
        updateCount();
        return;
    }

    items.slice(0, state.shown).forEach(function (item, index) {
        var post = makePost(item);
        if (index === 0 && state.filter === "all") {
            post.classList.add("latest");
        }
        elFeed.appendChild(post);
    });

    if (items.length > state.shown) {
        var more = document.createElement("button");
        more.className = "feed-more";
        more.textContent = "さらに表示 (残り " + (items.length - state.shown) + " 件)";
        more.addEventListener("click", function () {
            state.shown += PAGE_SIZE;
            renderFeed();
        });
        elFeed.appendChild(more);
    }
    updateCount();
}

/*
   新しいカードを先頭に差し込む
*/
function prependPost(item) {
    if (state.filter === "liked" && !item.liked) {
        updateCount();
        return;
    }
    var empty = elFeed.querySelector(".feed-empty");
    if (empty) {
        elFeed.innerHTML = "";
    }
    var prevLatest = elFeed.querySelector(".post.latest");
    if (prevLatest) {
        prevLatest.classList.remove("latest");
    }
    var post = makePost(item);
    post.classList.add("enter");
    if (state.filter === "all") {
        post.classList.add("latest");
    }
    elFeed.insertBefore(post, elFeed.firstChild);
    state.shown += 1;
    updateCount();
}

/*
   経過時間の表示を更新する
*/
function refreshTimes() {
    var nodes = elFeed.querySelectorAll(".post-time");
    Array.prototype.forEach.call(nodes, function (node) {
        node.textContent = timeLabel(Number(node.getAttribute("data-at")));
    });
}

/* =====================================================
   タイマー
===================================================== */
var elTimer = document.getElementById("timer");
var elFill = document.getElementById("timer-fill");
var elLabel = document.getElementById("timer-label");

function nextPrompt() {
    var item = generate();
    feed.unshift(item);
    if (feed.length > MAX_ITEMS) {
        feed.length = MAX_ITEMS;
    }
    persist();
    if (lastPersistTrimmed) {
        /* 古いカードを捨てた直後は並びが変わるので作り直す */
        renderFeed();
    } else {
        prependPost(item);
    }
    state.startedAt = Date.now();
    state.remain = INTERVAL_MS;
    updateTimer();
}

function updateTimer() {
    var left = state.paused
        ? state.remain
        : Math.max(0, INTERVAL_MS - (Date.now() - state.startedAt));
    var ratio = 1 - left / INTERVAL_MS;
    elFill.style.width = (ratio * 100).toFixed(1) + "%";
    elLabel.textContent = state.paused
        ? "一時停止中 (残り " + Math.ceil(left / 1000) + " 秒)"
        : "次のお題まで " + Math.ceil(left / 1000) + " 秒";
}

var lastTimeRefresh = 0;

/*
   30秒たったら自動で次のカードを追加する
*/
function tick() {
    if (!state.paused && Date.now() - state.startedAt >= INTERVAL_MS) {
        nextPrompt();
    } else {
        updateTimer();
    }
    if (Date.now() - lastTimeRefresh > 10000) {
        lastTimeRefresh = Date.now();
        refreshTimes();
    }
    requestAnimationFrame(tick);
}

function setPaused(paused) {
    if (paused === state.paused) {
        return;
    }
    if (paused) {
        state.remain = Math.max(0, INTERVAL_MS - (Date.now() - state.startedAt));
    } else {
        state.startedAt = Date.now() - (INTERVAL_MS - state.remain);
    }
    state.paused = paused;
    elTimer.classList.toggle("paused", paused);
    document.getElementById("btn-pause").textContent = paused ? "▶ 再開" : "⏸ 一時停止";
    updateTimer();
}

/* =====================================================
   クリップボード
===================================================== */
function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
            toast("コピーしました");
        }, function () {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}
/*
   clipboard API が使えない環境向け
*/
function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand("copy");
        toast("コピーしました");
    } catch (e) {
        toast("コピーできませんでした");
    }
    document.body.removeChild(ta);
}

/* =====================================================
   トースト
===================================================== */
var elToast = document.getElementById("toast");
var toastTimer = null;

function toast(message) {
    elToast.textContent = message;
    elToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
        elToast.classList.remove("show");
    }, 1800);
}

/* =====================================================
   イベント
===================================================== */
document.getElementById("btn-next").addEventListener("click", function () {
    nextPrompt();
});
document.getElementById("btn-pause").addEventListener("click", function () {
    setPaused(!state.paused);
});
document.getElementById("btn-copy-all").addEventListener("click", function () {
    var items = visibleItems();
    if (!items.length) {
        toast("コピーするカードがありません");
        return;
    }
    copyText(items.map(toPlainText).join("\n\n"));
});
document.getElementById("btn-clear").addEventListener("click", function () {
    if (!feed.length) {
        return;
    }
    if (window.confirm("保存中の " + feed.length + " 件のカードをすべて消去します。よろしいですか?")) {
        feed = [];
        state.shown = PAGE_SIZE;
        persist();
        renderFeed();
    }
});

/*
   セグメント (生成設定・表示フィルタ)
*/
function bindSegment(id, key, attr, onChange) {
    var seg = document.getElementById(id);
    seg.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) {
            return;
        }
        Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
            b.classList.remove("active");
        });
        btn.classList.add("active");
        state[key] = btn.getAttribute(attr);
        onChange();
    });
}
bindSegment("genre-seg", "genre", "data-genre", function () {
    nextPrompt();
});
bindSegment("type-seg", "type", "data-type", function () {
    nextPrompt();
});
bindSegment("filter-seg", "filter", "data-filter", function () {
    state.shown = PAGE_SIZE;
    renderFeed();
});

/*
   キーボード操作
*/
document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        setPaused(!state.paused);
    } else if (e.key === "ArrowRight") {
        nextPrompt();
    }
});

/* =====================================================
   起動
===================================================== */
loadFeed();
renderFeed();
nextPrompt();
requestAnimationFrame(tick);
</script>
</body>
</html>
