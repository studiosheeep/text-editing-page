<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創作お題ジェネレーター</title>
<link rel="apple-touch-icon" href="book-icon.png">
<link rel="icon" href="book-icon.png">
<meta name="apple-mobile-web-app-title" content="お題">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* =====================================================
   基本
===================================================== */
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f5f5f7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    color: #222;
    -webkit-text-size-adjust: 100%;
}
/* =====================================================
   アプリ全体
===================================================== */
.app {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 14px 60px;
}
/* =====================================================
   ヘッダー
===================================================== */
.header {
    padding: 18px 2px 10px;
}
.header-title {
    font-size: 20px;
    font-weight: bold;
}
.header-sub {
    margin-top: 4px;
    font-size: 12px;
    color: #777;
}
/* =====================================================
   上部に貼り付く操作バー
===================================================== */
.composer {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245, 245, 247, 0.93);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    padding: 8px 0 10px;
    margin-bottom: 10px;
}
/*
   生成設定 (ジャンル / 形式)
*/
.settings {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
}
.segment {
    display: flex;
    background: #e6e6e8;
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
}
.segment button {
    border: none;
    background: transparent;
    color: #444;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}
.segment button.active {
    background: #ffffff;
    color: #111;
    font-weight: bold;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}
/*
   タイマー
*/
.timer-bar {
    width: 100%;
    height: 4px;
    background: #e3e3e6;
    border-radius: 999px;
    overflow: hidden;
}
.timer-fill {
    height: 100%;
    width: 0%;
    background: #4a7ad6;
    border-radius: 999px;
}
.timer.paused .timer-fill {
    background: #bbb;
}
.timer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}
.timer-label {
    flex: 1;
    font-size: 12px;
    color: #888;
}
/*
   操作ボタン
*/
.bar-button {
    border: 1px solid #ddd;
    background: #ffffff;
    border-radius: 999px;
    font-size: 13px;
    font-family: inherit;
    color: #333;
    cursor: pointer;
    padding: 8px 14px;
    white-space: nowrap;
}
.bar-button:active {
    background: #eeeeF3;
}
.bar-button.primary {
    background: #4a7ad6;
    border-color: #4a7ad6;
    color: #ffffff;
    font-weight: bold;
}
/* =====================================================
   フィードの見出し
===================================================== */
.feed-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}
.feed-count {
    flex: 1;
    font-size: 12px;
    color: #888;
    white-space: nowrap;
}
.feed-head-buttons {
    display: flex;
    gap: 2px;
    margin-left: auto;
}
.text-button {
    border: none;
    background: none;
    color: #4a7ad6;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    padding: 4px;
}
/* =====================================================
   タイムライン
===================================================== */
.feed {
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 14px;
    overflow: hidden;
}
/*
   カード1枚
*/
.post {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid #eeeef0;
    cursor: pointer;
}
.post:last-child {
    border-bottom: none;
}
.post.latest {
    background: #fafbff;
}
/*
   出てきた瞬間のアニメーション
*/
.post.enter {
    animation: postin 0.45s ease;
}
@keyframes postin {
    from {
        opacity: 0;
        transform: translateY(-8px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}
/*
   アイコン
*/
.avatar {
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #eef3ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    line-height: 1;
}
.avatar.fantasy {
    background: #f5eefb;
}
/*
   本文まわり
*/
.post-main {
    flex: 1;
    min-width: 0;
}
.post-head {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    font-size: 13px;
}
.post-name {
    font-weight: bold;
}
.post-handle,
.post-time {
    color: #8a8a8f;
    font-size: 12px;
}
.post-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid #ddd;
    background: #fafafa;
    color: #555;
}
.post-badge.genre-real {
    background: #eef3ff;
    border-color: #ccd9f5;
    color: #3a5a9b;
}
.post-badge.genre-fantasy {
    background: #f5eefb;
    border-color: #e0cdf0;
    color: #75439b;
}
.post-body {
    margin-top: 5px;
    font-size: 15px;
    line-height: 1.85;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
/*
   縛り・読後感
*/
.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}
.chip {
    font-size: 12px;
    color: #555;
    background: #f2f2f4;
    border-radius: 7px;
    padding: 4px 9px;
}
.chip.topic {
    background: #fff3e0;
    color: #8a5300;
}
.chip.topic b {
    color: #bb8a44;
}
.chip b {
    color: #999;
    font-weight: normal;
    margin-right: 4px;
}
/*
   カード下部の操作
*/
.post-actions {
    display: flex;
    gap: 20px;
    margin-top: 10px;
}
.post-action {
    border: none;
    background: none;
    padding: 2px 0;
    font-size: 12px;
    font-family: inherit;
    color: #8a8a8f;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
}
.post-action:active {
    opacity: 0.6;
}
.post-action.liked {
    color: #d3455b;
}
/*
   さらに表示 / 空表示
*/
.feed-more {
    width: 100%;
    border: none;
    border-top: 1px solid #eeeef0;
    background: #ffffff;
    color: #4a7ad6;
    font-family: inherit;
    font-size: 13px;
    padding: 14px;
    cursor: pointer;
}
.feed-empty {
    padding: 22px 14px;
    font-size: 13px;
    color: #999;
    text-align: center;
}
/* =====================================================
   詳細ポップアップ
===================================================== */
.modal {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 40;
    display: none;
}
.modal.open {
    display: block;
}
.modal-back {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: rgba(0, 0, 0, 0.35);
}
.modal-sheet {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    transform: translateX(-50%);
    background: #ffffff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.18);
    display: flex;
    flex-direction: column;
    animation: sheetin 0.26s ease;
}
@keyframes sheetin {
    from {
        transform: translateX(-50%) translateY(26px);
        opacity: 0.3;
    }
    to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
}
.modal-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 14px;
    border-bottom: 1px solid #eeeef0;
}
.modal-title {
    flex: 1;
    font-size: 15px;
    font-weight: bold;
}
.modal-close {
    border: none;
    background: none;
    color: #888;
    font-size: 17px;
    cursor: pointer;
    padding: 4px 6px;
    font-family: inherit;
}
.modal-body {
    flex: 1 1 auto;
    min-height: 0;
    padding: 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.modal-foot {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid #eeeef0;
}
.modal-foot .bar-button {
    flex: 1;
    text-align: center;
}
/*
   あらすじの再掲
*/
.detail-summary {
    background: #fafbff;
    border: 1px solid #e8ecf7;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    line-height: 1.85;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.detail-label {
    font-size: 12px;
    color: #999;
    margin: 16px 0 6px;
}
/*
   登場人物
*/
.detail-cast div {
    font-size: 13px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}
.detail-cast b {
    color: #999;
    font-weight: normal;
    font-size: 12px;
    margin-right: 6px;
}
/*
   起承転結
*/
.beat {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f1f1f3;
}
.beat:last-child {
    border-bottom: none;
}
.beat-label {
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #eef3ff;
    color: #3a5a9b;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.beat-main {
    flex: 1;
    min-width: 0;
}
.beat-name {
    font-size: 11px;
    color: #aaa;
}
.beat-line {
    font-size: 14px;
    line-height: 1.85;
    margin-top: 2px;
    overflow-wrap: anywhere;
}
/*
   オチ
*/
.ending-box {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    background: #fff7ec;
    border: 1px solid #f0dfc4;
}
.ending-type {
    font-size: 11px;
    color: #8a5300;
}
.ending-text {
    font-size: 14px;
    line-height: 1.85;
    margin-top: 4px;
    overflow-wrap: anywhere;
}
/* =====================================================
   トースト
===================================================== */
.toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(10px);
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
}
.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
/* =====================================================
   注記
===================================================== */
.note {
    margin-top: 18px;
    font-size: 11px;
    color: #999;
    line-height: 1.7;
}
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-title">創作お題ジェネレーター</div>
        <div class="header-sub">30秒ごとにあらすじが流れてきます。新しいものが上に積まれます。</div>
    </div>

    <!-- 上部操作バー -->
    <div class="composer">
        <div class="settings">
            <div class="segment" id="genre-seg">
                <button data-genre="any" class="active">おまかせ</button>
                <button data-genre="real">現実</button>
                <button data-genre="fantasy">ファンタジー</button>
            </div>
            <div class="segment" id="news-seg">
                <button data-news="off" class="active">時事なし</button>
                <button data-news="some">時事ときどき</button>
                <button data-news="always">時事いつも</button>
            </div>
        </div>
        <div class="timer" id="timer">
            <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
            <div class="timer-row">
                <div class="timer-label" id="timer-label">次のお題まで 30 秒</div>
                <button class="bar-button" id="btn-pause">⏸ 一時停止</button>
                <button class="bar-button primary" id="btn-next">🎲 いま出す</button>
            </div>
        </div>
    </div>

    <!-- フィード -->
    <div class="feed-head">
        <div class="feed-count" id="feed-count"></div>
        <div class="segment" id="filter-seg">
            <button data-filter="all" class="active">すべて</button>
            <button data-filter="liked">★のみ</button>
        </div>
        <div class="feed-head-buttons">
            <button class="text-button" id="btn-copy-all">まとめてコピー</button>
            <button class="text-button" id="btn-clear">全消去</button>
        </div>
    </div>
    <div class="feed" id="feed"></div>

    <div class="note">
        ・カードをタップすると、話の流れ (起承転結) とオチが開きます<br>
        ・出てきたあらすじは自動でカード保存されます (このブラウザ内 localStorage、保存できる限り保持)<br>
        ・キーボード: スペースで一時停止 / → で次のお題<br>
        ・時事ネタは Wikipedia 日本語版の「最近の出来事」と「その日よく読まれた記事」から取得しています
        (CC BY-SA)。創作のお題に向かない話題は除外しています。
    </div>
</div>

<!-- 詳細ポップアップ -->
<div class="modal" id="modal">
    <div class="modal-back" id="modal-back"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="話の流れとオチ">
        <div class="modal-head">
            <div class="modal-title">話の流れとオチ</div>
            <button class="modal-close" id="modal-close" aria-label="閉じる">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-foot">
            <button class="bar-button" id="modal-reroll">🔀 別の展開</button>
            <button class="bar-button" id="modal-copy">📋 コピー</button>
            <button class="bar-button primary" id="modal-ok">閉じる</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

/* =====================================================

===================================================== */
function pick(list) {
    return list[Math.floor(Math.random() * list.length)];
}
/*
   同じ要素を引かずに2つ取り出す
*/
function pickTwo(list) {
    var a = pick(list);
    var b = pick(list);
    var guard = 0;
    while (b === a && list.length > 1 && guard < 20) {
        b = pick(list);
        guard++;
    }
    return [a, b];
}

var state = {
    genre: "any",
    news: "off",     /* off | some | always */
    filter: "all",

    shown: PAGE_SIZE
};

/* 新しい順に並んだカード配列 */
var feed = [];

/* =====================================================
   お題 / あらすじの生成
===================================================== */
function resolveGenre() {
    if (state.genre === "any") {
        return Math.random() < 0.5 ? "real" : "fantasy";
    }
    return state.genre;
}
function buildOne() {
    var genreKey = resolveGenre();
    var d = DATA[genreKey];
    var parts = {
        stage: pick(d.stage),
        hero: pick(d.hero),
        event: pick(d.event),
        twist: pick(d.twist),
        goal: pick(d.goal),
        kw: pick(d.keyword)
    };
    var text = pick(STORY_TEMPLATES)(parts) + "\n" + pick(KEY_TEMPLATES)(parts.kw);

    var item = {
        id: String(Date.now()) + "-" + Math.random().toString(36).slice(2, 8),
        genre: genreKey,
        type: "story",
        text: text,
        rule: pick(RULES),
        mood: pick(MOODS),
        parts: parts,
        at: Date.now(),
        liked: false
    };
    /* 時事ネタを混ぜる */
    if (state.news !== "off" && topics.length) {
        if (state.news === "always" || Math.random() < 0.45) {
            item.topic = pick(topics);
        }
    }
    return item;
}

/*
   直近のカードと重複しないように生成する
*/
function generate() {
    var recent = feed.slice(0, 12).map(function (item) {
        return item.text;
    });
    var item = buildOne();
    var guard = 0;
    while (recent.indexOf(item.text) !== -1 && guard < 30) {
        item = buildOne();
        guard++;
    }
    return item;
}

function genreLabel(item) {
    return DATA[item.genre] ? DATA[item.genre].label : "";
}
function typeLabel(item) {
    return item.type === "theme" ? "お題" : "あらすじ";
}
function toPlainText(item) {
    return "【" + genreLabel(item) + " / " + typeLabel(item) + "】\n"
        + item.text + "\n"
        + (item.topic ? "時事: " + item.topic + "\n" : "")
        + "縛り: " + item.rule + " / 読後感: " + item.mood;
}

/*
   カード id から決まった値を返す擬似乱数
*/
function hashString(text) {
    var h = 2166136261;
    for (var i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return h >>> 0;
}

function makeRandom(seed) {
    var t = seed >>> 0;
    return function () {
        t = (t + 0x6D2B79F5) >>> 0;
        var r = Math.imul(t ^ (t >>> 15), 1 | t);
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
}

function pickWith(rand, list) {
    return list[Math.floor(rand() * list.length)];
}

/*
   カードから「話の流れ」と「オチ」を組み立てる
*/
function buildDetail(item) {
    var genreKey = DETAIL[item.genre] ? item.genre : "real";
    var d = DETAIL[genreKey];
    var cast = DATA[genreKey].hero;
    var parts = item.parts || {};
    var rand = makeRandom(hashString(item.id + "|" + (item.detailSeed || 0)));

    /* 脇役は主人公と重ならないように選ぶ */
    var others = cast.filter(function (name) {
        return name !== parts.hero;
    });
    var ally = pickWith(rand, others);
    var rival = pickWith(rand, others.filter(function (name) {
        return name !== ally;
    }));

    var middleA = pickWith(rand, d.middle);
    var middleB = pickWith(rand, d.middle.filter(function (line) {
        return line !== middleA;
    }));
    var ending = pickWith(rand, d.ending);
    var kw = parts.kw || pickWith(rand, DATA[genreKey].keyword);

    var beats = [
        { label: "起", name: "はじまり", lines: [pickWith(rand, d.daily)] },
        { label: "承", name: "動きだす", lines: [middleA, middleB] },
        { label: "転", name: "ひっくり返る", lines: [pickWith(rand, d.turn)] },
        { label: "結", name: "決着", lines: [] }
    ];
    if (parts.event) {
        beats[0].lines.push(parts.event + "。");
    }
    if (parts.twist) {
        beats[2].lines.unshift(parts.twist + "。");
    }
    if (parts.goal) {
        beats[3].lines.push(parts.goal + "。");
    }

    return {
        stage: parts.stage || "",
        hero: parts.hero || "",
        ally: ally,
        rival: rival,
        beats: beats,
        endingType: ending.type,
        endingText: ending.text.replace("{kw}", kw)
    };
}

/*
   詳細をテキストに落とす (コピー用)
*/
function detailToPlainText(item) {
    var detail = buildDetail(item);
    var out = toPlainText(item) + "\n\n";
    if (detail.stage) {
        out += "舞台: " + detail.stage + "\n";
    }
    if (detail.hero) {
        out += "主人公: " + detail.hero + "\n";
    }
    out += "そばにいる人: " + detail.ally + "\n";
    out += "行く手をふさぐ人: " + detail.rival + "\n\n";
    detail.beats.forEach(function (beat) {
        out += "【" + beat.label + " " + beat.name + "】\n" + beat.lines.join("\n") + "\n";
    });
    out += "\nオチ (" + detail.endingType + "): " + detail.endingText;
    return out;
}

/* =====================================================
   時事ネタ (Wikipedia 日本語版)
   ---------------------------------------------------
   ・Portal:最近の出来事      … ニュースの見出し
   ・その日よく読まれた記事   … トレンドの語
   をまとめて取り込み、あらすじに混ぜる材料にする。
   どちらも CORS 許可済みで、鍵なしで呼べる。
===================================================== */
var TREND_KEY = "creative-prompt-trends";

/* 創作のお題として扱いたくない話題は落とす */
var TOPIC_NG = new RegExp(
    "死去|死亡|訃報|遺体|自殺|殺|射殺|災害|被災|地震|津波|洪水|豪雨|土石流|噴火|"
    + "事故|墜落|衝突|火災|延焼|テロ|戦争|侵攻|紛争|空爆|爆発|銃|ミサイル|拉致|"
    + "逮捕|容疑|起訴|有罪|虐待|暴行|性的|被害|感染|流行|病|死刑|失踪|行方不明|遭難"
);

var topics = [];
var trendState = "idle";   /* idle | loading | ready | failed */

function datePath(offsetDays) {
    var d = new Date(Date.now() - (offsetDays || 0) * 86400000);
    function pad(n) {
        return n < 10 ? "0" + n : String(n);
    }
    return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate());
}

function decodeEntities(text) {
    return text
        .replace(/&#(\d+);/g, function (m, code) {
            return String.fromCharCode(Number(code));
        })
        .replace(/&quot;/g, "\"")
        .replace(/&#39;/g, "'")
        .replace(/&nbsp;/g, " ")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&amp;/g, "&");
}

/*
   ニュース見出しの整形
   「（政治）（IT）…… -時事」のような前後の付属を落とす
*/
function cleanNewsLine(text) {
    var s = decodeEntities(text.replace(/<[^>]*>/g, ""));
    s = s.replace(/^(?:（[^）]{1,14}）)+/, "");
    s = s.replace(/\s*[-–—]\s*[^\s\-–—]{1,10}$/, "");
    return s.replace(/\s+/g, " ").trim();
}

function acceptTopic(text) {
    if (!text || text.length < 2 || text.length > 60) {
        return false;
    }
    if (text.indexOf(":") !== -1 || text.indexOf("：") !== -1) {
        return false;
    }
    if (text === "メインページ" || text.indexOf("Wikipedia") === 0) {
        return false;
    }
    return !TOPIC_NG.test(text);
}

function filterTopics(list) {
    var seen = {};
    var out = [];
    list.forEach(function (text) {
        var t = String(text || "").trim();
        if (acceptTopic(t) && !seen[t]) {
            seen[t] = true;
            out.push(t);
        }
    });
    return out.slice(0, 60);
}

/*
   その日よく読まれた記事
*/
function fetchMostRead(offsetDays) {
    return fetch("https://ja.wikipedia.org/api/rest_v1/feed/featured/" + datePath(offsetDays))
        .then(function (res) {
            if (!res.ok) {
                throw new Error("status " + res.status);
            }
            return res.json();
        })
        .then(function (data) {
            var list = (data && data.mostread && data.mostread.articles) || [];
            return list.map(function (a) {
                var title = a.normalizedtitle || a.title || "";
                return title.replace(/\s*\([^)]*\)$/, "");
            });
        });
}

/*
   最近の出来事 (見出しだけを取り出す。HTML は DOM に入れずに処理する)
*/
function fetchRecentNews() {
    var url = "https://ja.wikipedia.org/w/api.php?action=parse"
        + "&page=Portal%3A%E6%9C%80%E8%BF%91%E3%81%AE%E5%87%BA%E6%9D%A5%E4%BA%8B"
        + "&prop=text&formatversion=2&format=json&origin=*";
    return fetch(url)
        .then(function (res) {
            if (!res.ok) {
                throw new Error("status " + res.status);
            }
            return res.json();
        })
        .then(function (data) {
            var html = (data && data.parse && data.parse.text) || "";
            var items = html.match(/<li\b[^>]*>[\s\S]*?<\/li>/g) || [];
            return items.map(cleanNewsLine);
        });
}

function readCachedTopics() {
    try {
        var cache = JSON.parse(localStorage.getItem(TREND_KEY) || "null");
        if (cache && cache.date === datePath(0) && cache.items instanceof Array) {
            return cache.items;
        }
    } catch (e) {
        return null;
    }
    return null;
}

function writeCachedTopics(items) {
    try {
        localStorage.setItem(TREND_KEY, JSON.stringify({ date: datePath(0), items: items }));
    } catch (e) {
        /* 保存できなくても次回取り直すだけ */
    }
}

/*
   取得が間に合わなかった最新カードに、あとから話題を足す
*/
function applyTopicToLatest() {
    if (state.news === "off" || !topics.length || !feed.length) {
        return;
    }
    var latest = feed[0];
    if (latest.topic) {
        return;
    }
    if (state.news !== "always" && Math.random() >= 0.45) {
        return;
    }
    latest.topic = pick(topics);
    persist();
    renderFeed();
}

function loadTrends() {
    if (trendState === "loading" || trendState === "ready") {
        return;
    }
    var cached = readCachedTopics();
    if (cached && cached.length) {
        topics = cached;
        trendState = "ready";
        return;
    }
    if (typeof fetch !== "function") {
        trendState = "failed";
        return;
    }
    trendState = "loading";
    Promise.all([
        fetchMostRead(0).catch(function () {
            return fetchMostRead(1);
        }).catch(function () {
            return [];
        }),
        fetchRecentNews().catch(function () {
            return [];
        })
    ]).then(function (lists) {
        topics = filterTopics((lists[1] || []).concat(lists[0] || []));
        if (topics.length) {
            trendState = "ready";
            writeCachedTopics(topics);
            toast("今日の話題を " + topics.length + " 件読み込みました");
            applyTopicToLatest();
        } else {
            trendState = "failed";
            toast("時事ネタを取得できませんでした");
        }
    }, function () {
        trendState = "failed";
        toast("時事ネタを取得できませんでした");
    });
}

/* =====================================================
   保存 (localStorage)
   ---------------------------------------------------
   容量いっぱいまで保持し、書き込めなくなったら
   古いカードから順に捨てて入るところまで残す。
===================================================== */
var STORE_KEY = "creative-prompt-feed";
var OLD_STORE_KEY = "creative-prompt-saved";

function loadFeed() {
    var raw = null;
    try {
        raw = localStorage.getItem(STORE_KEY);
    } catch (e) {
        raw = null;
    }
    if (raw) {
        try {
            var parsed = JSON.parse(raw);
            if (parsed instanceof Array) {
                feed = parsed.filter(function (item) {
                    return item && typeof item.text === "string";
                });
            }
        } catch (e) {
            feed = [];
        }
        return;
    }
    /* 旧バージョンで★保存したお題を引き継ぐ */
    try {
        var old = JSON.parse(localStorage.getItem(OLD_STORE_KEY) || "[]");
        if (old instanceof Array) {
            feed = old.map(function (item, index) {
                return {
                    id: "legacy-" + index,
                    genre: item.genre === "fantasy" ? "fantasy" : "real",
                    type: item.type === "story" ? "story" : "theme",
                    text: String(item.text || ""),
                    rule: String(item.rule || ""),
                    mood: String(item.mood || ""),
                    at: 0,
                    liked: true
                };
            }).filter(function (item) {
                return item.text;
            });
        }
    } catch (e) {
        feed = [];
    }
}

/*
   直前の persist() でカードを間引いたか
   (間引いた場合は画面を作り直す必要がある)
*/
var lastPersistTrimmed = false;

function persist() {
    lastPersistTrimmed = false;
    if (feed.length > MAX_ITEMS) {
        feed.length = MAX_ITEMS;
        lastPersistTrimmed = true;
    }
    for (var attempt = 0; attempt < 200; attempt++) {
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify(feed));
            if (lastPersistTrimmed) {
                toast("保存できる上限に達したため、古いカードを整理しました");
            }
            return true;
        } catch (e) {
            /* 容量オーバー: 画面と保存がずれないよう、入るまで古いカードを捨てる */
            if (feed.length <= 1) {
                toast("これ以上は保存できませんでした");
                lastPersistTrimmed = true;
                return false;
            }
            var drop = Math.max(1, Math.floor(feed.length * 0.1));
            feed.splice(feed.length - drop, drop);
            lastPersistTrimmed = true;
        }
    }
    toast("これ以上は保存できませんでした");
    lastPersistTrimmed = true;
    return false;
}

/*
   経過時間の表示 (X のタイムラインに近い表記)
*/
function timeLabel(at) {
    if (!at) {
        return "以前";
    }
    var diff = Date.now() - at;
    if (diff < 60000) {
        return "たった今";
    }
    if (diff < 3600000) {
        return Math.floor(diff / 60000) + "分前";
    }
    if (diff < 86400000) {
        return Math.floor(diff / 3600000) + "時間前";
    }
    var d = new Date(at);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
}

function makeChip(label, value) {
    var chip = document.createElement("span");
    chip.className = "chip";
    var b = document.createElement("b");
    b.textContent = label;
    chip.appendChild(b);
    chip.appendChild(document.createTextNode(value));
    return chip;
}

    var handle = document.createElement("span");
    handle.className = "post-handle";

    main.appendChild(body);

    /* 縛り・読後感 */
    var chips = document.createElement("div");
    chips.className = "chips";
    if (item.topic) {
        var topicChip = makeChip("時事", item.topic);

    main.appendChild(chips);

    /* 操作 */

    var likeBtn = document.createElement("button");

    likeBtn.textContent = (item.liked ? "★" : "☆") + " お気に入り";
    likeBtn.addEventListener("click", function () {
        item.liked = !item.liked;
        persist();
        if (lastPersistTrimmed || (state.filter === "liked" && !item.liked)) {
            renderFeed();
        } else {
            likeBtn.className = "post-action" + (item.liked ? " liked" : "");
            likeBtn.textContent = (item.liked ? "★" : "☆") + " お気に入り";
            updateCount();
        }
    });
    actions.appendChild(likeBtn);

    var copyBtn = document.createElement("button");
    copyBtn.className = "post-action";
    copyBtn.textContent = "📋 コピー";
    copyBtn.addEventListener("click", function () {

    });
    actions.appendChild(copyBtn);

    var detailBtn = document.createElement("button");
    detailBtn.className = "post-action";
    detailBtn.textContent = "📖 詳しく";
    detailBtn.addEventListener("click", function () {
        openDetail(item);
    });
    actions.appendChild(detailBtn);

    var delBtn = document.createElement("button");
    delBtn.className = "post-action";
    delBtn.textContent = "🗑 削除";
    delBtn.addEventListener("click", function () {
        var index = feed.indexOf(item);
        if (index !== -1) {
            feed.splice(index, 1);
            persist();
            renderFeed();
        }
    });
    actions.appendChild(delBtn);

    main.appendChild(actions);
    post.appendChild(main);

    /* カードのどこを押しても詳細を開く (ボタンの上は除く) */
    post.addEventListener("click", function (e) {
        if (e.target.closest("button")) {
            return;
        }
        openDetail(item);
    });
    return post;
}

/*
   件数表示
*/
function updateCount() {
    var liked = feed.filter(function (item) {
        return item.liked;
    }).length;
    elCount.textContent = "カード " + feed.length + " 件"
        + (liked ? " (★ " + liked + ")" : "");
}

/*
   フィード全体を描き直す
*/
function renderFeed() {
    var items = visibleItems();
    if (state.shown < PAGE_SIZE) {
        state.shown = PAGE_SIZE;
    }
    elFeed.innerHTML = "";

    if (!items.length) {
        var empty = document.createElement("div");
        empty.className = "feed-empty";
        empty.textContent = state.filter === "liked"
            ? "★を付けたお題がここに並びます。"
            : "まもなく最初のお題が流れてきます。";
        elFeed.appendChild(empty);
        updateCount();
        return;
    }

    items.slice(0, state.shown).forEach(function (item, index) {
        var post = makePost(item);
        if (index === 0 && state.filter === "all") {
            post.classList.add("latest");
        }
        elFeed.appendChild(post);
    });

    if (items.length > state.shown) {
        var more = document.createElement("button");
        more.className = "feed-more";
        more.textContent = "さらに表示 (残り " + (items.length - state.shown) + " 件)";
        more.addEventListener("click", function () {
            state.shown += PAGE_SIZE;
            renderFeed();
        });
        elFeed.appendChild(more);
    }
    updateCount();
}

/*
   新しいカードを先頭に差し込む
*/
function prependPost(item) {
    if (state.filter === "liked" && !item.liked) {
        updateCount();
        return;
    }
    var empty = elFeed.querySelector(".feed-empty");
    if (empty) {
        elFeed.innerHTML = "";
    }
    var prevLatest = elFeed.querySelector(".post.latest");
    if (prevLatest) {
        prevLatest.classList.remove("latest");
    }
    var post = makePost(item);
    post.classList.add("enter");
    if (state.filter === "all") {
        post.classList.add("latest");
    }
    elFeed.insertBefore(post, elFeed.firstChild);
    state.shown += 1;
    updateCount();
}

   経過時間の表示を更新する
*/
function refreshTimes() {
    var nodes = elFeed.querySelectorAll(".post-time");
    Array.prototype.forEach.call(nodes, function (node) {
        node.textContent = timeLabel(Number(node.getAttribute("data-at")));
    });
}

/* =====================================================
   タイマー
===================================================== */
var elTimer = document.getElementById("timer");
var elFill = document.getElementById("timer-fill");
var elLabel = document.getElementById("timer-label");

function nextPrompt() {
    var item = generate();
    feed.unshift(item);
    if (feed.length > MAX_ITEMS) {
        feed.length = MAX_ITEMS;
    }
    persist();
    if (lastPersistTrimmed) {
        /* 古いカードを捨てた直後は並びが変わるので作り直す */
        renderFeed();
    } else {
        prependPost(item);
    }
    state.startedAt = Date.now();
    state.remain = INTERVAL_MS;
    updateTimer();
}

function updateTimer() {
    var left = state.paused
        ? state.remain
        : Math.max(0, INTERVAL_MS - (Date.now() - state.startedAt));
    var ratio = 1 - left / INTERVAL_MS;
    elFill.style.width = (ratio * 100).toFixed(1) + "%";
    elLabel.textContent = state.paused
        ? "一時停止中 (残り " + Math.ceil(left / 1000) + " 秒)"
        : "次のお題まで " + Math.ceil(left / 1000) + " 秒";
}

var lastTimeRefresh = 0;

/*
   30秒たったら自動で次のカードを追加する
*/
function tick() {
    if (!state.paused && Date.now() - state.startedAt >= INTERVAL_MS) {
        nextPrompt();
    } else {
        updateTimer();
    }
    if (Date.now() - lastTimeRefresh > 10000) {
        lastTimeRefresh = Date.now();
        refreshTimes();
    }
    requestAnimationFrame(tick);
}

function setPaused(paused) {
    if (paused === state.paused) {
        return;
    }
    if (paused) {
        state.remain = Math.max(0, INTERVAL_MS - (Date.now() - state.startedAt));
    } else {
        state.startedAt = Date.now() - (INTERVAL_MS - state.remain);
    }
    state.paused = paused;
    elTimer.classList.toggle("paused", paused);
    document.getElementById("btn-pause").textContent = paused ? "▶ 再開" : "⏸ 一時停止";
    updateTimer();
}

/* =====================================================
   クリップボード
===================================================== */
function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
            toast("コピーしました");
        }, function () {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}
/*
   clipboard API が使えない環境向け
*/
function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand("copy");
        toast("コピーしました");
    } catch (e) {
        toast("コピーできませんでした");
    }
    document.body.removeChild(ta);
}

        var row = document.createElement("div");
        row.className = "beat";
        row.appendChild(makeLine("beat-label", beat.label));

        var main = document.createElement("div");
        main.className = "beat-main";
        main.appendChild(makeLine("beat-name", beat.name));
        beat.lines.forEach(function (line) {
            main.appendChild(makeLine("beat-line", line));
        });
        row.appendChild(main);
        elModalBody.appendChild(row);
    });

    /* オチ */
    var box = document.createElement("div");
    box.className = "ending-box";
    box.appendChild(makeLine("ending-type", "オチ — " + detail.endingType));
    box.appendChild(makeLine("ending-text", detail.endingText));
    elModalBody.appendChild(box);

    elModalBody.scrollTop = 0;
}

function openDetail(item) {
    detailItem = item;
    renderDetail();
    elModal.classList.add("open");
    /* 読んでいる間は自動更新を止める */
    if (!state.paused) {
        pausedForModal = true;
        setPaused(true);
    }
}

function closeDetail() {
    if (!detailItem) {
        return;
    }
    elModal.classList.remove("open");
    detailItem = null;
    if (pausedForModal) {
        pausedForModal = false;
        setPaused(false);
    }
}

document.getElementById("modal-close").addEventListener("click", closeDetail);
document.getElementById("modal-ok").addEventListener("click", closeDetail);
document.getElementById("modal-back").addEventListener("click", closeDetail);
document.getElementById("modal-copy").addEventListener("click", function () {
    if (detailItem) {
        copyText(detailToPlainText(detailItem));
    }
});
document.getElementById("modal-reroll").addEventListener("click", function () {
    if (!detailItem) {
        return;
    }
    detailItem.detailSeed = (detailItem.detailSeed || 0) + 1;
    persist();
    if (lastPersistTrimmed) {
        renderFeed();
    }
    renderDetail();
});

/* =====================================================
   イベント
===================================================== */
document.getElementById("btn-next").addEventListener("click", function () {
    nextPrompt();
});
document.getElementById("btn-pause").addEventListener("click", function () {
    setPaused(!state.paused);
});
document.getElementById("btn-copy-all").addEventListener("click", function () {
    var items = visibleItems();
    if (!items.length) {
        toast("コピーするカードがありません");
        return;
    }
    copyText(items.map(toPlainText).join("\n\n"));
});
document.getElementById("btn-clear").addEventListener("click", function () {
    if (!feed.length) {
        return;
    }
    if (window.confirm("保存中の " + feed.length + " 件のカードをすべて消去します。よろしいですか?")) {
        feed = [];
        state.shown = PAGE_SIZE;
        persist();
        renderFeed();
    }
});

/*
   セグメント (生成設定・表示フィルタ)
*/
function bindSegment(id, key, attr, onChange) {
    var seg = document.getElementById(id);
    seg.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) {
            return;
        }
        Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
            b.classList.remove("active");
        });
        btn.classList.add("active");
        state[key] = btn.getAttribute(attr);
        onChange();
    });
}
bindSegment("genre-seg", "genre", "data-genre", function () {
    saveSettings();
    nextPrompt();
});
bindSegment("news-seg", "news", "data-news", function () {
    saveSettings();
    if (state.news !== "off") {
        loadTrends();
    }
    nextPrompt();
});
bindSegment("filter-seg", "filter", "data-filter", function () {
    state.shown = PAGE_SIZE;
    renderFeed();
});

/*
   キーボード操作
*/
document.addEventListener("keydown", function (e) {
    if (detailItem) {
        if (e.key === "Escape") {
            closeDetail();
        }
        return;
    }
    if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        setPaused(!state.paused);
    } else if (e.key === "ArrowRight") {
        nextPrompt();
    }
});

/* =====================================================
   起動
===================================================== */
loadSettings();
applySettings();
if (state.news !== "off") {
    loadTrends();
}
loadFeed();
renderFeed();
nextPrompt();
requestAnimationFrame(tick);
</script>
</body>
</html>
